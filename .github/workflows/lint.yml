# Lint, run inside the same workspace the test workflow builds: this module's own
# go.mod resolves the framework from the released tag, while here it is linted
# against the framework checkout.

name: Lint
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  # The framework is cloned from GitHub here; CNB uses its own host.
  # The entry for this repository is ignored: ci.sh always tests the checkout the
  # runner supplied, so a pull request is tested as it is.
  GRADII_FRAMEWORK_URL: https://github.com/gradii/framework
  GRADII_FRAMEWORK_REF: main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the workspace
        run: echo "GOWORK=$(bash .cnb/ci.sh workspace | sed -n 's/^GOWORK=//p')" >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
